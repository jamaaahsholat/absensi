<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Gerakan Sholat Jamaah Sholeh Solehah · MAN 1 Pasuruan</title>
<style>
  :root {
    --hijau: #1b5e20; --hijau-muda: #e8f5e9; --merah: #b71c1c; --merah-muda: #ffebee;
    --kuning: #8a6d00; --kuning-muda: #fff8e1; --teks: #1f2937; --abu: #6b7280; --garis: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #f3f6f4; color: var(--teks); }
  header { background: var(--hijau); color: #fff; padding: 22px 16px 46px; text-align: center; }
  header h1 { margin: 0; font-size: 1.2rem; line-height: 1.3; }
  header h1 span { color: #ffd54f; }
  header p { margin: 6px 0 0; opacity: .85; font-size: .9rem; }
  .judul { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           max-width: 460px; margin: 0 auto 4px; text-align: left; }
  .judul .sekolah { margin-top: 4px; font-weight: 600; opacity: .9; }
  .logo { width: 64px; height: 64px; object-fit: contain; flex-shrink: 0;
          filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); }
  #jam { font-size: 2.2rem; font-weight: 700; letter-spacing: 1px; margin-top: 10px; font-variant-numeric: tabular-nums; }
  main { max-width: 460px; margin: -30px auto 24px; padding: 0 16px; }
  .card { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.06); margin-bottom: 14px; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 0 0 6px; }
  select { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid var(--garis); border-radius: 10px;
           background: #fff; margin-bottom: 14px; color: var(--teks); }
  button { width: 100%; padding: 15px; font-size: 1.05rem; font-weight: 700; border: 0; border-radius: 12px;
           background: var(--hijau); color: #fff; cursor: pointer; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  #btnBH { background: #fff; color: #ad1457; border: 2px solid #ad1457; margin-top: 10px; display: none; }
  #btnBH:disabled { color: #9ca3af; border-color: #d1d5db; background: #fff; }
  #catatanBH { display: none; font-size: .78rem; color: var(--abu); text-align: center; margin: 6px 0 0; }
  .info { display: flex; gap: 10px; }
  .info div { flex: 1; text-align: center; background: #f9fafb; border-radius: 10px; padding: 10px 6px; }
  .info small { display: block; color: var(--abu); font-size: .75rem; }
  .info b { font-size: 1.1rem; }
  .pesan { border-radius: 10px; padding: 12px 14px; font-size: .95rem; margin-top: 14px; display: none; line-height: 1.4; }
  .ok { background: var(--hijau-muda); color: var(--hijau); display: block; }
  .gagal { background: var(--merah-muda); color: var(--merah); display: block; }
  .tunggu { background: var(--kuning-muda); color: var(--kuning); display: block; }
  .dalam { color: var(--hijau); } .luar { color: var(--merah); }
  footer { text-align: center; color: var(--abu); font-size: .75rem; padding-bottom: 20px; }
</style>
</head>

<main>

    <div class="info">
      <div><small>Jarak ke masjid</small><b id="jarak">–</b></div>
      <div><small>Akurasi GPS</small><b id="akurasi">–</b></div>
      <div><small>Status</small><b id="statusLokasi">–</b></div>
    </div>
  </div>

  <div class="card">
    <label for="kelas">Kelas / Guru</label>
    <select id="kelas"><option value="">Memuat kelas…</option></select>

    <label for="siswa">Nama</label>
    <select id="siswa" disabled><option value="">Pilih kelas / guru dulu</option></select>

    <button id="btnAbsen" disabled>Absen Sekarang</button>
    <button id="btnBH" disabled>Berhalangan (Haid)</button>
    <p id="catatanBH">Khusus yang sedang haid. Dicatat di sekitar masjid (serambi/halaman), jam yang sama.</p>
    <div id="pesan" class="pesan"></div>
  </div>
</main>
<footer>Lokasi hanya dipakai untuk memastikan Anda berada di area masjid.<br><span id="kodeHp" style="opacity:.7"></span></footer>

<script>
/* ==== GANTI dengan URL Web App dari Apps Script (berakhiran /exec) ==== */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxCzpNusuP6SeVJyN2c22rOfrwdw-_2HRYuqvYqNXXLWuFYPMa_91m7CRGhtTKYWpRR/exec';

let info = null;        // pengaturan dari server (koordinat masjid, radius, jam)
let posisi = null;      // posisi GPS terakhir
let selisihJam = 0;     // selisih jam HP dengan jam server (detik)

const $ = id => document.getElementById(id);

function tampilPesan(teks, jenis) {
  const el = $('pesan');
  el.textContent = teks;
  el.className = 'pesan ' + jenis;
}

async function api(params) {
  const res = await fetch(SCRIPT_URL + '?' + new URLSearchParams(params));
  return res.json();
}

function hitungJarak(lat1, lng1, lat2, lng2) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const a = Math.sin(r(lat2 - lat1) / 2) ** 2 +
            Math.cos(r(lat1)) * Math.cos(r(lat2)) * Math.sin(r(lng2 - lng1) / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

/* ---- Jam: ikut jam server, bukan jam HP ---- */
function mulaiJam(jamServer) {
  const [h, m, s] = jamServer.split(':').map(Number);
  const d = new Date();
  selisihJam = (h * 3600 + m * 60 + s) - (d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds());
  setInterval(() => {
    const n = new Date();
    let t = (n.getHours() * 3600 + n.getMinutes() * 60 + n.getSeconds() + selisihJam + 86400) % 86400;
    const p = x => String(x).padStart(2, '0');
    $('jam').textContent = p(Math.floor(t / 3600)) + ':' + p(Math.floor(t / 60) % 60) + ':' + p(t % 60);
  }, 1000);
}

/* ---- Tampilkan jarak ke masjid (dipanggil saat GPS atau data server datang) ---- */
function tampilJarak() {
  if (posisi) $('akurasi').textContent = '±' + Math.round(posisi.accuracy) + ' m';
  if (posisi && info && info.masjid) {
    const j = hitungJarak(posisi.latitude, posisi.longitude, info.masjid.lat, info.masjid.lng);
    $('jarak').textContent = Math.round(j) + ' m';
    const dalam = j <= info.radius;
    $('statusLokasi').textContent = dalam ? 'Di area' : 'Di luar';
    $('statusLokasi').className = dalam ? 'dalam' : 'luar';
  }
  cekTombol();
}

/* ---- Pantau lokasi terus-menerus untuk menampilkan jarak ---- */
function pantauLokasi() {
  if (!navigator.geolocation) {
    tampilPesan('Perangkat tidak mendukung GPS.', 'gagal');
    return;
  }
  navigator.geolocation.watchPosition(pos => {
    posisi = pos.coords;
    simpanRiwayat(pos);
    tampilJarak();
  }, err => {
    const teks = err.code === 1
      ? 'Izin lokasi ditolak. Izinkan akses lokasi untuk aplikasi ini di Pengaturan HP.'
      : 'Lokasi belum terbaca. Pastikan GPS aktif.';
    tampilPesan(teks, 'gagal');
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
}

let daftarNama = [];
function cekTombol() {
  const siap = !!($('siswa').value && posisi);
  $('btnAbsen').disabled = !siap;
  $('btnBH').disabled = !siap;
  const orang = daftarNama.find(s => s.nis === $('siswa').value);
  const perempuan = !!(orang && orang.jk === 'P');
  $('btnBH').style.display = perempuan ? 'block' : 'none';
  $('catatanBH').style.display = perempuan ? 'block' : 'none';
}

/* ---- Isi pilihan kelas & siswa ---- */
async function muatKelas() {
  const r = await api({ action: 'kelas' });
  const sel = $('kelas');
  sel.innerHTML = '<option value="">— Pilih kelas / guru —</option>' +
    r.kelas.map(k => `<option value="${k}">${k === 'GURU' ? 'Guru' : k}</option>`).join('');
  let simpan = null;
  try { simpan = localStorage.getItem('kelas'); } catch (e) {}
  if (simpan && r.kelas.includes(simpan)) { sel.value = simpan; await muatSiswa(); }
}

async function muatSiswa() {
  const kelas = $('kelas').value;
  const sel = $('siswa');
  sel.disabled = true;
  if (!kelas) { sel.innerHTML = '<option value="">Pilih kelas / guru dulu</option>'; cekTombol(); return; }
  sel.innerHTML = '<option value="">Memuat…</option>';
  try { localStorage.setItem('kelas', kelas); } catch (e) {}
  const r = await api({ action: 'siswa', kelas });
  sel.innerHTML = '<option value="">— Pilih nama —</option>' +
    r.siswa.map(s => `<option value="${s.nis}">${s.nama}</option>`).join('');
  daftarNama = r.siswa;
  sel.disabled = false;
  let nis = null;
  try { nis = localStorage.getItem('nis'); } catch (e) {}
  if (nis && r.siswa.some(s => s.nis === nis)) sel.value = nis;
  cekTombol();
}

/* ---- ID perangkat (satu HP = satu orang per hari) ---- */
let idSesi = null;   // cadangan: identitas HP tetap sama selama aplikasi terbuka
function idPerangkat() {
  // 1) APK App Inventor: identitas dari TinyDB (permanen), dikirim lewat WebViewer.WebViewString
  try {
    if (window.AppInventor && typeof window.AppInventor.getWebViewString === 'function') {
      const dariApk = String(window.AppInventor.getWebViewString() || '').replace(/\s+/g, '');
      if (/^[A-Za-z0-9-]{6,}$/.test(dariApk)) return dariApk;   // mis. HP-123..., HP123..., dll.
    }
  } catch (e) {}
  // 2) Penyimpanan browser (versi web / iPhone)
  let id = null;
  try { id = localStorage.getItem('perangkat'); } catch (e) {}
  // 3) Cadangan selama aplikasi terbuka
  if (!id) id = idSesi;
  if (!id) {
    const a = new Uint8Array(12);
    (window.crypto || window.msCrypto).getRandomValues(a);
    id = 'HP-' + Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
    try { localStorage.setItem('perangkat', id); } catch (e) {}
  }
  idSesi = id;
  return id;
}

/* ---- Pembacaan GPS dikumpulkan sejak aplikasi dibuka (untuk deteksi lokasi palsu) ---- */
let riwayat = [];   // pembacaan GPS terakhir {lat, lng, acc, t}
function simpanRiwayat(p) {
  if (riwayat.some(h => h.t === p.timestamp)) return;
  riwayat.push({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: p.timestamp });
  if (riwayat.length > 10) riwayat.shift();
}
// Langsung kirim jika sudah ada >= 3 pembacaan baru; jika belum, tunggu paling lama 3 detik.
function ambilSampel() {
  const segar = () => riwayat.filter(h => Date.now() - h.t < 90000);
  return new Promise(resolve => {
    if (segar().length >= 3) return resolve(segar());
    tampilPesan('Memeriksa lokasi…', 'tunggu');
    const mulai = Date.now();
    const iv = setInterval(() => {
      if (segar().length >= 3 || Date.now() - mulai > 3000) { clearInterval(iv); resolve(segar()); }
    }, 200);
  });
}

/* ---- Kirim absen ---- */
async function absen(status) {
  const nis = $('siswa').value;
  if (!nis || !posisi) return;
  try { localStorage.setItem('nis', nis); } catch (e) {}
  const bh = status === 'Berhalangan';
  const btn = bh ? $('btnBH') : $('btnAbsen');
  const teksAsli = btn.textContent;
  $('btnAbsen').disabled = true;
  $('btnBH').disabled = true;
  btn.textContent = 'Memeriksa…';
  try {
    const sampel = await ambilSampel();
    if (sampel.length < 1) {
      tampilPesan('Lokasi belum terbaca dengan baik. Pastikan GPS aktif lalu coba lagi.', 'gagal');
      return;
    }
    const akhir = sampel[sampel.length - 1];
    btn.textContent = 'Mengirim…';
    tampilPesan('Mengirim absen…', 'tunggu');
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ nis, kelas: $('kelas').value, device: idPerangkat(), versi: 4, status,
                             lat: akhir.lat, lng: akhir.lng, akurasi: akhir.acc, sampel })
    });
    const r = await res.json();
    tampilPesan(r.pesan, r.ok ? 'ok' : 'gagal');
  } catch (e) {
    tampilPesan('Tidak bisa terhubung ke server. Periksa koneksi internet.', 'gagal');
  } finally {
    btn.textContent = teksAsli;
    cekTombol();
  }
}

/* ---- Mulai ---- */
(async function init() {
  $('kelas').addEventListener('change', muatSiswa);
  $('siswa').addEventListener('change', cekTombol);
  $('btnAbsen').addEventListener('click', () => absen('Hadir'));
  setTimeout(() => { $('kodeHp').textContent = 'Kode HP: ' + idPerangkat() + ' · versi 5'; }, 500);
  $('btnBH').addEventListener('click', () => absen('Berhalangan'));
  pantauLokasi();
  try {
    info = await api({ action: 'info' });
    if (!info.ok) throw new Error(info.pesan);
    $('jadwal').textContent = `Absen dibuka ${info.jamMulai} – ${info.jamSelesai} WIB · radius ${info.radius} m`;
    mulaiJam(info.jamServer);
    tampilJarak();
    if (!info.status.buka) tampilPesan(info.status.pesan, 'tunggu');
    await muatKelas();
  } catch (e) {
    $('jadwal').textContent = 'Gagal terhubung ke server';
    tampilPesan('Tidak bisa terhubung ke server. Periksa koneksi internet lalu buka ulang aplikasi.', 'gagal');
  }
})();
</script>
